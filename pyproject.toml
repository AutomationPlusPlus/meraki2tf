[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meraki2tf"
version = "0.1.0"
description = "Extract Cisco Meraki configurations and translate them into Terraform structures with drift detection and alerting."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
# Bounded to the validated major line so an unattended worker rebuild
# mid-incident can't silently pull an untested SDK (DR reproducibility)
# or a compromised future major. For the deployment path, resolve this
# through the hash-pinned requirements-lock.txt at the repository root
# (pip install --require-hashes -r requirements-lock.txt).
dependencies = ["meraki>=4.3,<5"]

[project.scripts]
meraki2tf = "meraki2tf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"meraki2tf.data" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["meraki2tf"]

[[tool.mypy.overrides]]
module = "meraki.*"
ignore_missing_imports = true
