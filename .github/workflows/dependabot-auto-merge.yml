name: Dependabot auto-merge

# Enables GitHub auto-merge on qualifying dependabot PRs. The merge
# itself only happens once the branch-protection-required CI checks
# pass — this workflow never merges anything directly.
#
# Policy (see CONTRIBUTING.md):
#   - dev/CI tooling and GitHub Actions: patch + minor auto-merge
#   - meraki SDK (the only runtime dependency): patch only
#   - all majors, and meraki minors, stay open for human review

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable auto-merge within policy
        if: >-
          steps.meta.outputs.update-type != 'version-update:semver-major' &&
          (steps.meta.outputs.dependency-names != 'meraki' ||
           steps.meta.outputs.update-type == 'version-update:semver-patch')
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Explain manual-review holds
        if: >-
          steps.meta.outputs.update-type == 'version-update:semver-major' ||
          (steps.meta.outputs.dependency-names == 'meraki' &&
           steps.meta.outputs.update-type != 'version-update:semver-patch')
        run: >-
          gh pr comment "$PR_URL" --body
          "Held for human review per auto-merge policy:
          major bumps and non-patch meraki SDK updates need a maintainer
          (the fixture-based CI suite cannot prove live-API behavior)."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
