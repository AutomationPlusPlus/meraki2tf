# Local quality gates. Run manually with: pre-commit run --all-files
# Requires the project venv to be active (flake8/mypy resolve from PATH).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml

  - repo: local
    hooks:
      - id: flake8
        name: flake8 (approved linter)
        entry: python -m flake8 src/ tests/
        language: system
        types: [python]
        pass_filenames: false
      - id: mypy
        name: mypy (strict type check)
        entry: python -m mypy src/
        language: system
        types: [python]
        pass_filenames: false
