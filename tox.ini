[tox]
envlist = lint, type, py3
isolated_build = true

[testenv]
deps =
    pytest
    pytest-cov
commands =
    pytest --cov=src --cov-report=term-missing {posargs}

[testenv:lint]
deps = flake8
skip_install = true
commands = flake8 src/ tests/

[testenv:type]
deps =
    mypy
    pytest
commands = mypy src/
