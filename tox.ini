[tox]
envlist = lint, type, audit, lock, py311, py312, py313, py314
isolated_build = true
skip_missing_interpreters = true

[testenv]
deps =
    pytest
    pytest-cov
commands =
    pytest --cov=src --cov-report=term-missing --cov-fail-under=100 {posargs}

[testenv:lint]
deps = flake8
skip_install = true
commands = flake8 src/ tests/ tools/

[testenv:type]
deps =
    mypy
    pytest
commands = mypy src/ tools/

[testenv:audit]
; Dependency-CVE scan (pip-audit, approved CI/dev-only dependency).
; Audits the environment holding the installed package + runtime deps.
deps = pip-audit
commands = pip-audit

[testenv:lock]
; The hash-pinned closure the unattended worker and the container image
; install from. Nothing else here touches that file — the other envs
; resolve pyproject's range — so a dependency bump that moves the SDK's
; own requirements can break the DR install path without a single red
; check. Resolves against PyPI (network), unlike the pytest envs.
skip_install = true
deps =
commands = python {toxinidir}/tools/check_lock_closure.py
